name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * *'   # Tous les jours à 8h
    - cron: '0 20 * * *'  # Tous les jours à 20h
  workflow_dispatch:


jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/intervenants?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --fail-with-body || true
