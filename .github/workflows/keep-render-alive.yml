name: Keep Render Alive

on:
  schedule:
    - cron: '0 10 * * *'  # Tous les jours à 10h
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -X GET "${{ secrets.RENDER_URL }}/api/health" \
            --fail-with-body || true
