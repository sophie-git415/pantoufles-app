name: Keep Render Alive
on:
  schedule:
    - cron: '0 10 * * *'  # Tous les jours à 10h
    - cron: '0 20 * * *'  # Tous les jours à 20h
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping Render Backend
        run: |
          curl -X GET "${{ secrets.RENDER_URL }}/api/health" \
            --fail-with-body || true

      - name: Update timestamp file
        run: |
          echo "Dernier ping : $(date)" > last-ping.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-ping.txt
          git commit -m "chore: keep-alive ping $(date +'%Y-%m-%d %H:%M')" || echo "Rien à committer"
          git push
